[package]
name = "harbor-cad"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Local scientific CAD job worker with explicit qualification gates"
repository = "https://github.com/caniko/harbor-cad"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
fleetix = { version = "0.6.0", default-features = false }
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
roxmltree = "=0.21.1"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.22", features = ["v4"] }

[dev-dependencies]
tempfile = "3.24"

[lints.clippy]
all = "warn"
