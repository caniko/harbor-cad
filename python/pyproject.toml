[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "harbor-cad-mcp"
version = "0.1.0"
description = "Narrow MCP profiles for the local harbor-cad Rust worker"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-or-later"
dependencies = ["mcp==2.3.0", "jsonschema==4.26.0"]

[project.scripts]
harbor-cad-mcp = "harbor_cad_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["harbor_cad_mcp"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
python-downloads = "never"
